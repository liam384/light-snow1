<!DOCTYPE html>
<html lang="zh-TW" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心靈陪伴伴侶 - 溫柔在線</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Noto Sans TC', 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(0.98); }
        }
        .animate-pulse-subtle { animation: pulse-subtle 3s infinite ease-in-out; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.25s ease-out forwards; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col overflow-hidden">

    <!-- 密碼解鎖或設定畫面 -->
    <div id="lock-screen" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
            <div id="lock-icon" class="text-4xl mb-1">🔒</div>
            <h2 id="lock-title" class="text-lg font-bold text-white">請輸入解鎖密碼</h2>
            <p id="lock-desc" class="text-xs text-slate-400">為了保護您的心事隱私，請輸入密碼解鎖</p>
           
            <div class="space-y-3">
                <input
                    type="password"
                    id="lock-password-input"
                    maxlength="12"
                    placeholder="請輸入密碼"
                    class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-center text-slate-100 placeholder-slate-600 focus:outline-none focus:border-pink-500 tracking-widest text-lg"
                    onkeypress="if(event.key === 'Enter') handleLockSubmit()"
                />
                <div id="lock-error" class="text-xs text-red-400 hidden">密碼錯誤，請重新輸入</div>
               
                <button
                    onclick="handleLockSubmit()"
                    class="w-full py-3 bg-gradient-to-r from-pink-600 to-violet-600 hover:from-pink-500 hover:to-violet-500 text-white font-medium rounded-xl transition-all shadow-lg text-sm active:scale-95"
                >
                    解鎖進入
                </button>

                <button
                    id="lock-skip-btn"
                    onclick="handleLockSkip()"
                    class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 text-xs rounded-xl transition-colors hidden"
                >
                    先不設定，直接進入
                </button>
            </div>
        </div>
    </div>

    <!-- 頁面頂部導覽列 -->
    <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between shadow-md z-10">
        <div class="flex items-center space-x-3">
            <div class="relative">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-pink-500 to-violet-500 flex items-center justify-center text-white font-bold text-lg shadow-lg" id="avatar-container">
                    🌸
                </div>
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></div>
            </div>
            <div>
                <h1 class="font-bold text-base text-white flex items-center gap-2">
                    <span id="companion-name">小雪</span>
                    <span class="text-[10px] px-2 py-0.5 bg-pink-500/20 text-pink-300 rounded-full border border-pink-500/30 font-normal">專屬溫柔陪伴</span>
                </h1>
                <p class="text-xs text-slate-400 flex items-center gap-1.5" id="companion-status">
                    <span>隨時傾聽你的心事，給你滿滿的情緒價值 ☕</span>
                </p>
            </div>
        </div>
       
        <div class="flex items-center space-x-2">
            <div class="hidden sm:flex items-center space-x-1.5 bg-slate-800/80 px-3 py-1.5 rounded-full border border-slate-700 text-xs">
                <span class="text-pink-400">💖 親密度:</span>
                <span id="intimacy-score" class="font-bold text-white">12分</span>
            </div>
            <!-- 自動語音開關 -->
            <button id="voice-toggle-btn" onclick="toggleAutoVoice()" class="p-2 rounded-xl bg-pink-900/40 hover:bg-pink-800/50 text-pink-300 transition-colors border border-pink-700/50 flex items-center gap-1 text-xs shadow-sm" title="切換自動撒嬌語音">
                <span id="voice-icon">🔊</span>
                <span id="voice-status-text" class="hidden md:inline text-slate-200">撒嬌語音: 開</span>
            </button>
            <button onclick="openQrModal()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700 flex items-center gap-1 text-xs" title="產生QR Code分享">
                📱 <span class="hidden md:inline">掃碼分享</span>
            </button>
            <button onclick="openSettings()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors border border-slate-700" title="伴侶與安全設定">
                ⚙️
            </button>
        </div>
    </header>

    <!-- 主要聊天內容區塊 -->
    <main class="flex-1 flex flex-col overflow-hidden relative max-w-4xl w-full mx-auto">
        <!-- 聊天訊息歷史紀錄 -->
        <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4">
            <!-- 訊息動態渲染區 -->
        </div>

        <!-- 快捷情緒提示詞 (Quick Prompt Chips) -->
        <div class="px-4 py-2 bg-slate-950/80 border-t border-slate-900 flex items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-none text-xs">
            <span class="text-slate-500 shrink-0">💡 快捷陪伴:</span>
            <button onclick="sendQuickPrompt('今天工作好累，想要拍拍… 🥺')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-all shrink-0">今天好累 🥺</button>
            <button onclick="sendQuickPrompt('我剛剛發生一件超開心的事！ ✨')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-all shrink-0">分享好事情 ✨</button>
            <button onclick="sendQuickPrompt('有點睡不著，可以跟我說說話嗎？ 🌙')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 px-3 py-1.5 rounded-full transition-all shrink-0">深夜聊聊 🌙</button>

        </div>

        <!-- 輸入框區塊 -->
        <div class="p-3 sm:p-4 bg-slate-900 border-t border-slate-800">
            <form onsubmit="handleSendMessage(event)" class="flex items-center gap-2">
                <input
                    type="text"
                    id="user-input"
                    placeholder="跟伴侶聊聊今天發生的事、心事或感受..."
                    class="flex-1 bg-slate-950 border border-slate-800 rounded-2xl px-4 py-3 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-pink-500/80 transition-colors"
                    autocomplete="off"
                />
                <button
                    type="submit"
                    class="bg-gradient-to-r from-pink-600 to-violet-600 hover:from-pink-500 hover:to-violet-500 text-white font-medium px-5 py-3 rounded-2xl transition-all shadow-lg flex items-center justify-center shrink-0 text-sm active:scale-95"
                >
                    <span>傳送</span>
                    <span class="ml-1 text-xs">✨</span>
                </button>
            </form>
        </div>
    </main>

    <!-- 設定彈窗 (Settings Modal) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-5 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">

                    <span>⚙️ 伴侶與隱私設定</span>
                </h3>
                <button onclick="closeSettings()" class="text-slate-400 hover:text-white text-lg">✕</button>
            </div>

            <!-- 人設切換 -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300 block">🎭 選擇陪伴人設風格</label>
                <select id="companion-persona" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500">
                    <option value="gentle">🌸 溫柔甜美 - 小雪 (無條件包容、軟萌暖心)</option>
                    <option value="tsundere">⚡ 傲嬌青梅 - 羽瑄 (嘴硬心軟、愛吐槽的小嬌嗔)</option>
                    <option value="healing">🍵 知性學姐 - 知秋 (成熟療癒、撫平焦慮與孤單)</option>
                    <option value="energetic">🔥 元氣美少女 - 星瞳 (熱情活力、滿滿正能量)</option>
                </select>
            </div>

            <!-- 暱稱設定 -->
            <div class="space-y-2">
                <label class="text-xs font-semibold text-slate-300 block">✏️ 伴侶自訂暱稱</label>
                <input type="text" id="setting-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none focus:border-pink-500" placeholder="設定您專屬的伴侶名字">
            </div>

            <!-- 密碼保護設定區塊 -->
            <div class="bg-slate-950 p-4 rounded-2xl border border-slate-800/80 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-semibold text-slate-300 flex items-center gap-1">
                        🔒 密碼保護鎖
                    </span>
                    <span id="password-status-badge" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">未設定密碼</span>
                </div>

                <!-- 未設密碼時顯示 -->
                <div id="no-password-controls" class="space-y-2">
                    <div class="flex gap-2">
                        <input type="password" id="new-password-input" placeholder="設定新密碼 (至少4碼)" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500">
                        <button onclick="setPasswordFromSettings()" class="bg-pink-600 hover:bg-pink-500 text-white text-xs px-3 py-2 rounded-xl transition-colors shrink-0">啟用密碼</button>
                    </div>
                </div>

                <!-- 已設密碼時顯示 -->
                <div id="has-password-controls" class="space-y-2 hidden">
                    <div class="flex gap-2">
                        <input type="password" id="change-password-input" placeholder="輸入要修訂的新密碼" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-pink-500">
                        <button onclick="changeExistingPassword()" class="bg-violet-600 hover:bg-violet-500 text-white text-xs px-3 py-2 rounded-xl transition-colors shrink-0">變更密碼</button>
                    </div>
                    <button onclick="removePasswordProtection()" class="w-full py-1.5 bg-red-950/40 hover:bg-red-900/60 border border-red-800/50 text-red-300 text-xs rounded-xl transition-colors">解除密碼鎖</button>
                </div>
            </div>

            <!-- 對話紀錄管理 -->
            <div class="space-y-2 pt-2 border-t border-slate-800">
                <label class="text-xs font-semibold text-slate-300 block">💾 對話紀錄與備份管理</label>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="exportChatAsText()" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors border border-slate-700">
                        📄 保留紀錄 (.txt)
                    </button>
                    <button onclick="exportBackup()" class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors border border-slate-700">
                        📦 匯出完整備份 (.json)
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <label class="py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors border border-slate-700 cursor-pointer text-center">
                        📥 匯入備份檔
                        <input type="file" accept=".json" onchange="importBackup(event)" class="hidden">
                    </label>
                    <button onclick="clearChatHistory()" class="py-2.5 bg-red-950/40 hover:bg-red-900/60 border border-red-900/50 text-red-300 rounded-xl text-xs flex items-center justify-center gap-1.5 transition-colors">
                        🗑️ 清除對話紀錄
                    </button>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
                <button onclick="saveSettings()" class="w-full py-3 bg-gradient-to-r from-pink-600 to-violet-600 hover:from-pink-500 hover:to-violet-500 text-white font-medium rounded-xl text-xs shadow-lg transition-all">
                    儲存變更
                </button>
            </div>
        </div>
    </div>

    <!-- QR Code 分享彈窗 -->
    <div id="qr-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-xs w-full p-6 shadow-2xl text-center space-y-4">
            <h3 class="text-base font-bold text-white">📱 掃碼開啟伴侶陪伴</h3>
            <p class="text-xs text-slate-400">掃描下方 QR Code，在手機上與您的心靈伴侶聊天：</p>
            
            <div class="bg-slate-950 p-4 rounded-2xl flex justify-center border border-slate-800">
                <div id="qrcode-container"></div>
            </div>

            <button onclick="copyCurrentUrl()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-xl border border-slate-700 transition-colors">
                🔗 複製網址連結
            </button>
            
            <button onclick="closeQrModal()" class="w-full py-2 bg-slate-950 hover:bg-slate-900 text-slate-400 hover:text-slate-200 text-xs rounded-xl transition-colors">
                關閉
            </button>
        </div>
    </div>

        // 解鎖邏輯
        function checkStartupLock() {
            const lockScreen = document.getElementById('lock-screen');
            const lockTitle = document.getElementById('lock-title');
            const lockDesc = document.getElementById('lock-desc');
            const skipBtn = document.getElementById('lock-skip-btn');

            if (state.password && state.password.trim().length > 0) {
                isFirstTimeSetup = false;
                lockTitle.innerText = '請輸入解鎖密碼';
                lockDesc.innerText = '為了保護您的心事隱私，請輸入密碼解鎖';
                skipBtn.classList.add('hidden');
                lockScreen.classList.remove('hidden');
            } else {
                lockScreen.classList.add('hidden');
            }
        }

        function handleLockSubmit() {
            const inputVal = document.getElementById('lock-password-input').value;
            const errorEl = document.getElementById('lock-error');

            if (isFirstTimeSetup) {
                if (inputVal.length > 0 && inputVal.length < 4) {
                    errorEl.innerText = '密碼長度至少需要 4 碼';
                    errorEl.classList.remove('hidden');
                    return;
                }
                if (inputVal.length >= 4) {
                    state.password = inputVal;
                    saveState();
                }
                document.getElementById('lock-screen').classList.add('hidden');
                showCustomModal('密碼設定成功！開始享受溫馨陪伴吧 ✨');
            } else {
                if (inputVal === state.password) {
                    document.getElementById('lock-screen').classList.add('hidden');
                    document.getElementById('lock-password-input').value = '';
                    errorEl.classList.add('hidden');
                } else {
                    errorEl.innerText = '密碼錯誤，請重新輸入';
                    errorEl.classList.remove('hidden');
                }
            }
        }

        function handleLockSkip() {
            if (isFirstTimeSetup) {
                document.getElementById('lock-screen').classList.add('hidden');
                showCustomModal('已略過密碼設定，您可隨時至設定中啟用');
            }
        }

        function updatePasswordUIState() {
            const badge = document.getElementById('password-status-badge');
            const noPwdControls = document.getElementById('no-password-controls');

        // Gemini TTS API 語音生成與播放
        async function playTTSVoice(text, messageIndex = null) {
            if (!text) return;

            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }

            const cleanText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

            const config = personaConfigs[state.persona] || personaConfigs.gentle;
            const btnId = messageIndex !== null ? `tts-btn-${messageIndex}` : null;
            const btnEl = btnId ? document.getElementById(btnId) : null;

            if (btnEl) btnEl.innerHTML = '⏳ 語音生成中...';

            try {
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`;

                const promptText = `${config.voicePrompt}\n${cleanText}`;

                const payload = {
                    contents: [{
                        parts: [{ text: promptText }]
                    }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: {
                            voiceConfig: {
                                prebuiltVoiceConfig: { voiceName: config.voiceName || 'Leda' }
                            }
                        }
                    }
                };

                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error('TTS response error');

                const result = await response.json();
                const part = result?.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType || 'audio/L16;rate=24000';

                if (audioData) {
                    let sampleRate = 24000;
                    const match = mimeType.match(/rate=(\d+)/);
                    if (match) sampleRate = parseInt(match[1], 10);

                    const pcmBuffer = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmBuffer);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    const audioUrl = URL.createObjectURL(wavBlob);

                    currentAudio = new Audio(audioUrl);
                    
                    if (btnEl) btnEl.innerHTML = '🎵 播放中...';

                    currentAudio.onended = () => {
                        if (btnEl) btnEl.innerHTML = '🔊 聽撒嬌語音';
                        currentAudio = null;
                    };

                    await currentAudio.play();
                } else {
                    throw new Error('No audio data returned');
                }
            } catch (err) {
                console.error('TTS Generation error:', err);
                if (btnEl) btnEl.innerHTML = '❌ 語音暫時無法載入';
                setTimeout(() => {
                    if (btnEl) btnEl.innerHTML = '🔊 聽撒嬌語音';
                }, 2000);
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16Array, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16Array.length * 2);
            const view = new DataView(buffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + pcm16Array.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(view, 36, 'data');
            view.setUint32(40, pcm16Array.length * 2, true);

            let offset = 44;
            for (let i = 0; i < pcm16Array.length; i++, offset += 2) {
                view.setInt16(offset, pcm16Array[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        async function generateEmpatheticResponse(userMessage, personaKey) {
            const config = personaConfigs[personaKey];
            const apiKey = "";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const recentHistory = state.messages.slice(-8).map(m => ({
                role: m.role === 'user' ? 'user' : 'model',
                parts: [{ text: m.content }]
            }));

            const payload = {
                contents: recentHistory,
                systemInstruction: {
                    parts: [{ text: config.systemPrompt + " 務必保持高度的情緒價值、同理心與溫暖陪伴感，字數適中，不要長篇大論教條，像個真正在乎他的貼心伴侶。" }]
                }
            };

            let retries = 3;
            let delay = 1000;
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                   
                    if (!response.ok) throw new Error('API response failed');
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    }
                } catch (e) {
                    await new Promise(res => setTimeout(res, delay));
                    delay *= 2;
                }
            }

            return getFallbackResponse(userMessage, personaKey);
        }

            loadSavedData();
            checkStartupLock();
            updateUIFromPersona();
            updatePasswordUIState();
            updateVoiceBtnUI();
           
            if (state.messages.length === 0) {
                const currentConfig = personaConfigs[state.persona] || personaConfigs.gentle;
                state.messages.push({
                    role: 'assistant',
                    content: currentConfig.greeting,
                    time: getCurrentTime()
                });
            }
            renderMessages();
        });
    </script>
</body>
